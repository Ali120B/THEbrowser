<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';"><title>THE Browser</title><link rel="stylesheet" href="./styles.css"></head><body><header><strong>THE<span>/</span>Browser</strong><div class="controls"><button data-command="back" title="Back">←</button><button data-command="forward" title="Forward">→</button><button data-command="reload" title="Reload">↻</button></div><form id="navigation"><input id="address" aria-label="Address or search" autocomplete="off"><button>Go</button></form><button data-command="devtools">DevTools</button></header><aside><div class="eyebrow">WORKSPACE</div><h1 id="workspace-name">My workspace</h1><div class="stack-label">STACK · INBOX <button id="new-card" title="New card">＋</button></div><nav id="cards" aria-label="Cards"></nav><p class="hint">This is a real Chromium surface. Cards and their URLs persist locally.</p></aside><main><div id="card-meta"><span id="card-title">Loading…</span><span id="card-status"></span></div><div class="content-note">Web content is rendered by a secured Electron <code>WebContentsView</code>, not by this shell.</div></main><script src="./app.js"></script></body></html>
